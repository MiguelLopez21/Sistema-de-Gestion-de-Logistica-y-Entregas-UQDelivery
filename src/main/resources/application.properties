spring.application.name=UQDelivery

spring.datasource.url=jdbc:h2:mem:uqdelivery
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data/usuarios.sql,classpath:data/envios.sql,classpath:data/asignaciones.sql

# Administrador inicial (solo desarrollo)
uqdelivery.admin.correo=admin@uqdelivery.com
uqdelivery.admin.password=Admin12345
